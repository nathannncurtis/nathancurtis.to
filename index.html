<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>À la Carte · Nathan Curtis</title>
    <meta name="description" content="Poems, photographs, music, software, essays, and the odd good meal. The house of Curtis, all of it in one place. Order anything, in any order." />
    <meta name="author" content="Nathan Curtis" />
    <meta name="theme-color" content="#f8f4ea" />

    <!-- One table, one address. The whole house is served from /; the ?seat and
         the #fragments are seating, not pages. Trailing slash to match what the
         apex 301 already hands back. -->
    <link rel="canonical" href="https://nathancurtis.to/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="À la Carte" />
    <meta property="og:title" content="À la Carte · Nathan Curtis" />
    <meta property="og:description" content="Poems, photographs, music, software, essays, and the odd good meal. All of it, in one place." />
    <meta property="og:image" content="https://nathancurtis.to/og.png" />
    <meta property="og:image:alt" content="A cream menu card. Maison NC, est. MMXXIV, sits above the title À la Carte in large serif, with the house of Curtis beneath it and a line of courses: poems, photographs, music, software, essays, recipes." />
    <meta property="og:url" content="https://nathancurtis.to/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="À la Carte · Nathan Curtis" />
    <meta name="twitter:description" content="Poems, photographs, music, software, essays, and the odd good meal. All of it, in one place." />
    <meta name="twitter:image" content="https://nathancurtis.to/og.png" />
    <meta name="twitter:image:alt" content="A cream menu card. Maison NC, est. MMXXIV, sits above the title À la Carte in large serif, with the house of Curtis beneath it and a line of courses: poems, photographs, music, software, essays, recipes." />

    <!-- Favicon: the crow, everywhere. ico for Safari and old caches, svg for
         the rest, touch icon for home screens. v=2 evicts the old icon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Static head, so crawlers get this before any JS runs. Person and WebSite
         only: there are no per-piece URLs to hang an Article on, and no dish
         photographs, so no Recipe either. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://nathancurtis.to/#nathan",
            "name": "Nathan Curtis",
            "url": "https://nathancurtis.to/",
            "description": "I make things across whatever medium holds my attention: photographs, poems, essays, music, software, the occasional ambitious dinner. This is all of it, in one place.",
            "image": {
              "@type": "ImageObject",
              "url": "https://nathancurtis.to/sig.png",
              "width": 522,
              "height": 188,
              "caption": "Nathan Curtis, signed"
            },
            "sameAs": [
              "https://github.com/nathannncurtis",
              "https://steddi.io"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://nathancurtis.to/#site",
            "name": "À la Carte",
            "alternateName": "À la Carte · Nathan Curtis",
            "url": "https://nathancurtis.to/",
            "description": "Poems, photographs, music, software, essays, and the odd good meal. The house of Curtis, all of it in one place. Order anything, in any order.",
            "slogan": "Pictures, poems, songs, software, and the odd good meal.",
            "inLanguage": "en",
            "image": {
              "@type": "ImageObject",
              "url": "https://nathancurtis.to/og.png",
              "width": 1200,
              "height": 630
            },
            "author": { "@id": "https://nathancurtis.to/#nathan" },
            "publisher": { "@id": "https://nathancurtis.to/#nathan" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Cormorant+SC:wght@400;500;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      #root { opacity: 0; }
      #root.ready { opacity: 1; transition: opacity 0.6s ease; }
    </style>
  </head>
  <body style="background:#f8f4ea">
    <!--
                 __
                ( o>
                )  \
               /_/\_\
          ~~~~~~"~~"~~~~~~~

        you looked under the plate. the kitchen appreciates a curious guest.
        the menu, in plain text: /menu.txt
    -->
    <div id="root"></div>
    <noscript>
      <div style="padding:3rem 2rem;color:#2f2e2a;background:#f8f4ea;font-family:Georgia,serif;text-align:center;">
        <div style="font-size:0.72rem;letter-spacing:0.3em;text-transform:uppercase;color:#6c6343;">Maison NC</div>
        <h1 style="font-style:italic;font-weight:500;">À la Carte</h1>
        <p style="color:#65635c;font-style:italic;">The house needs JavaScript to open. The menu, in plain text: <a href="/menu.txt" style="color:#a8551f;">/menu.txt</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
